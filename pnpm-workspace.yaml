packages:
  - 'apps/*'
  - 'packages/*'
# pnpm blocks dependency build scripts by default. These are the explicit approvals.
#
# better-sqlite3 ships a native addon and needs its install script to fetch or compile
# the binding.
#
# esbuild ships a platform binary; vite and vitest cannot run without it, so the frontend
# milestone needs its install script.
#
# sharp is Next's optional image optimiser. Approved so `pnpm install` exits clean rather
# than erroring on an ignored build; no code here uses next/image.
#
# Each tree-sitter grammar ships both a native addon and a prebuilt `.wasm`. TraceIQ
# loads only the WASM, through web-tree-sitter, so the native build is denied: compiling a C parser
# at install time would need a toolchain, would slow every install, and would produce a binding
# nothing imports. Denying it keeps `pnpm install` fast and portable.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  tree-sitter-python: false
  tree-sitter-java: false
  tree-sitter-go: false
